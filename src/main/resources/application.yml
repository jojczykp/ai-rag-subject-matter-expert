spring:
  application:
    name: ai-subject-matter-expert
  main:
    banner-mode: console
  datasource:
    url: ${AISME_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aisme}
    username: ${AISME_DATASOURCE_USERNAME:aisme}
    password: ${AISME_DATASOURCE_PASSWORD:aisme}
  flyway:
    enabled: true

aisme:
  documents:
    location: classpath:/subject-documents/
    chunk-size: 700
    chunk-overlap: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
