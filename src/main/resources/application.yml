spring:
  application:
    name: ai-subject-matter-expert
  main:
    banner-mode: console
  datasource:
    url: ${AISME_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aisme}
    username: ${AISME_DATASOURCE_USERNAME:aisme}
    password: ${AISME_DATASOURCE_PASSWORD:aisme}
  flyway:
    enabled: true

aisme:
  documents:
    location: classpath:/subject-documents/
    chunk-size: 700
    chunk-overlap: 100
  embedding-model:
    id: local-bge-small
    version: "1.5"
    dimensions: 384
    runtime: ONNX
    model-path: ./models/bge-small-en-v1.5/model.onnx
    tokenizer-path: ./models/bge-small-en-v1.5/tokenizer.json
  llama-runtime:
    enabled: false
    config:
      asset-directory: ./models/llama
      server-executable-path: ./bin/llama-server
      host: 127.0.0.1
      port: 18080
      models:
        - id: llama-runtime-example
          display-name: Embedded Llama
          gguf-file: models/llama.gguf
          context-size: 4096
          runtime-arguments: []
          license: TODO
          hardware-requirements: TODO
  chat:
    timeout: 60s
  chat-model-availability:
    timeout: 5s
    cache-ttl: 5s
  chat-models:
    - id: local-ollama-llama
      enabled: true
      config:
        display-name: Local Ollama Llama
        runtime: OLLAMA
        mode: LOCAL_SERVER
        available-offline: false
        base-url: http://localhost:11434
        model-name: llama3.2
    - id: openai-compatible-example
      enabled: false
      config:
        display-name: OpenAI-Compatible Cloud Example
        runtime: OPENAI_COMPATIBLE
        mode: ONLINE
        available-offline: false
        base-url: https://api.example.com/v1
        model-name: example-chat-model
        api-key: placeholder-api-key
    - id: hugging-face-tgi-example
      enabled: false
      config:
        display-name: Hugging Face TGI Example
        runtime: HUGGING_FACE_ENDPOINT
        mode: ONLINE
        available-offline: false
        base-url: https://example.endpoints.huggingface.cloud
        api-key: placeholder-api-key
    - id: llama-runtime-example
      enabled: false
      config:
        display-name: Llama Runtime Example
        runtime: EMBEDDED_OFFLINE
        mode: EMBEDDED_OFFLINE
        available-offline: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
