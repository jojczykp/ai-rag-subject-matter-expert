info:
  app:
    name: AI RAG Subject Matter Expert
    description: Backend RAG application for subject-matter chat.

aisme:
  documents:
    location: classpath:/subject-documents/
    chunk-size: 700
    chunk-overlap: 100
  embedding:
    api-timeout: 60s
    default-model-id: ollama-nomic-embed
    model-availability:
      timeout: 5s
      cache-ttl: 5s
    runtimes:
      local-onnx:
        type: ONNX
      local-ollama:
        type: OLLAMA
        base-url: http://localhost:11434
    models:
      local-bge-small:
        enabled: true
        display-order: 10
        display-name: Local BGE Small (1.5, 384d)
        version: "1.5"
        dimensions: 384
        runtime:
          id: local-onnx
          model-path: ./models/bge-small-en-v1.5/model.onnx
          tokenizer-path: ./models/bge-small-en-v1.5/tokenizer.json
      ollama-nomic-embed:
        enabled: true
        display-order: 20
        display-name: Ollama Nomic Embed (v1.5, 768d)
        version: "v1.5"
        dimensions: 768
        runtime:
          id: local-ollama
          model-name: nomic-embed-text:v1.5
  chat:
    default-model-id: embedded-mistral-7b
    api-timeout: 60s
    relevant-chunk-limit: 5
    model-availability:
      timeout: 5s
      cache-ttl: 5s
    runtimes:
      embedded-llama:
        type: EMBEDDED_LLAMA
        asset-directory: ./models/llama
        server-executable-path: ./models/llama/bin/llama-server
      local-ollama:
        type: OLLAMA
        base-url: http://localhost:11434
      openai-compatible:
        type: OPENAI_COMPATIBLE
        base-url: https://api.example.com/v1
        api-key: ${OPENAI_API_KEY:}
      hugging-face-tgi:
        type: HUGGING_FACE_TGI
        base-url: https://example.endpoints.huggingface.cloud
        api-key: ${HF_API_KEY:}
      spring-ai:
        type: SPRING_AI
    models:
      embedded-qwen-0-5b:
        enabled: true
        display-order: 10
        display-name: Embedded Qwen 0.5B
        description: Fully offline embedded model backed by a local GGUF asset.
        runtime:
          id: embedded-llama
          model-name: qwen2.5-0.5b-instruct-q4_k_m
          gguf-file: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          context-size: 2048
          runtime-arguments: []
      embedded-qwen-1-5b:
        enabled: true
        display-order: 20
        display-name: Embedded Qwen 1.5B
        description: Smarter fully offline embedded model backed by a local GGUF asset.
        runtime:
          id: embedded-llama
          model-name: qwen2.5-1.5b-instruct-q4_k_m
          gguf-file: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          context-size: 2048
          runtime-arguments: []
      embedded-qwen-3b:
        enabled: true
        display-order: 30
        display-name: Embedded Qwen 3B
        description: Larger fully offline embedded model backed by a local GGUF asset.
        runtime:
          id: embedded-llama
          model-name: qwen2.5-3b-instruct-q4_k_m
          gguf-file: models/qwen2.5-3b-instruct-q4_k_m.gguf
          context-size: 2048
          runtime-arguments: []
      embedded-mistral-7b:
        enabled: true
        display-order: 40
        display-name: Embedded Mistral 7B
        description: Heavier fully offline embedded model for stronger local answers.
        runtime:
          id: embedded-llama
          model-name: mistral-7b-instruct-v0.3-q4_k_m
          gguf-file: models/mistral-7b-instruct-v0.3-q4_k_m.gguf
          context-size: 2048
          runtime-arguments: []
      local-ollama-llama:
        enabled: true
        display-order: 50
        display-name: Local Ollama Llama
        description: Local Ollama model for chat requests when Ollama is running on this machine.
        runtime:
          id: local-ollama
          model-name: llama3.2
      openai-compatible-example:
        enabled: true
        display-order: 60
        display-name: OpenAI-Compatible Cloud Example
        description: Online OpenAI-compatible model for cloud-hosted chat requests.
        runtime:
          id: openai-compatible
          model-name: example-chat-model
      hugging-face-tgi-example:
        enabled: true
        display-order: 70
        display-name: Hugging Face TGI Example
        description: Online Hugging Face endpoint using the TGI-compatible generate API.
        runtime:
          id: hugging-face-tgi
  api:
    cors:
      allowed-origins:
        - http://localhost:5173

spring:
  application:
    name: ai-subject-matter-expert
  main:
    banner-mode: console
  datasource:
    url: ${AISME_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aisme}
    username: ${AISME_DATASOURCE_USERNAME:aisme}
    password: ${AISME_DATASOURCE_PASSWORD:aisme}
  flyway:
    enabled: true

management:
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
