info:
  app:
    name: AI RAG Subject Matter Expert
    description: Backend RAG application for subject-matter chat.

spring:
  application:
    name: ai-subject-matter-expert
  main:
    banner-mode: console
  datasource:
    url: ${AISME_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aisme}
    username: ${AISME_DATASOURCE_USERNAME:aisme}
    password: ${AISME_DATASOURCE_PASSWORD:aisme}
  flyway:
    enabled: true

aisme:
  api:
    cors:
      allowed-origins:
        - http://localhost:5173
  documents:
    location: classpath:/subject-documents/
    chunk-size: 700
    chunk-overlap: 100
  embedding-model:
    id: local-bge-small
    version: "1.5"
    dimensions: 384
    runtime: ONNX
    model-path: ./models/bge-small-en-v1.5/model.onnx
    tokenizer-path: ./models/bge-small-en-v1.5/tokenizer.json
  embedded-llama:
    asset-directory: ./models/llama
    server-executable-path: ./models/llama/bin/llama-server
    models:
      - id: embedded-qwen-0-5b
        enabled: true
        display-name: Embedded Qwen 0.5B
        gguf-file: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        context-size: 2048
        runtime-arguments: []
      - id: embedded-qwen-1-5b
        enabled: true
        display-name: Embedded Qwen 1.5B
        gguf-file: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        context-size: 2048
        runtime-arguments: []
      - id: embedded-qwen-3b
        enabled: true
        display-name: Embedded Qwen 3B
        gguf-file: models/qwen2.5-3b-instruct-q4_k_m.gguf
        context-size: 2048
        runtime-arguments: []
  chat:
    timeout: 60s
    relevant-chunk-limit: 5
  chat-model-availability:
    timeout: 5s
    cache-ttl: 5s
  chat-models:
    - id: embedded-qwen-0-5b
      enabled: true
      config:
        display-name: Embedded Qwen 0.5B
        description: Fully offline embedded model backed by a local GGUF asset.
        runtime: EMBEDDED_OFFLINE
        mode: EMBEDDED_OFFLINE
        available-offline: true
    - id: embedded-qwen-1-5b
      enabled: true
      config:
        display-name: Embedded Qwen 1.5B
        description: Smarter fully offline embedded model backed by a local GGUF asset.
        runtime: EMBEDDED_OFFLINE
        mode: EMBEDDED_OFFLINE
        available-offline: true
    - id: embedded-qwen-3b
      enabled: true
      config:
        display-name: Embedded Qwen 3B
        description: Larger fully offline embedded model backed by a local GGUF asset.
        runtime: EMBEDDED_OFFLINE
        mode: EMBEDDED_OFFLINE
        available-offline: true
    - id: local-ollama-llama
      enabled: true
      config:
        display-name: Local Ollama Llama
        description: Local Ollama model for chat requests when Ollama is running on this machine.
        runtime: OLLAMA
        mode: LOCAL_SERVER
        available-offline: false
        base-url: http://localhost:11434
        model-name: llama3.2
    - id: openai-compatible-example
      enabled: true
      config:
        display-name: OpenAI-Compatible Cloud Example
        description: Online OpenAI-compatible model for cloud-hosted chat requests.
        runtime: OPENAI_COMPATIBLE
        mode: ONLINE
        available-offline: false
        base-url: https://api.example.com/v1
        model-name: example-chat-model
        api-key: ${OPENAI_API_KEY:}
    - id: hugging-face-tgi-example
      enabled: true
      config:
        display-name: Hugging Face TGI Example
        description: Online Hugging Face endpoint using the TGI-compatible generate API.
        runtime: HUGGING_FACE_ENDPOINT
        mode: ONLINE
        available-offline: false
        base-url: https://example.endpoints.huggingface.cloud
        api-key: ${HF_API_KEY:}

management:
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
