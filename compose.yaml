services:
  app:
    build:
      context: .
    environment:
      AISME_DATASOURCE_URL: jdbc:postgresql://db:5432/aisme
      AISME_DATASOURCE_USERNAME: aisme
      AISME_DATASOURCE_PASSWORD: aisme
      SPRING_PROFILES_ACTIVE: container,${AISME_MODEL_PROFILE:-minimal}
    ports:
      - "8080:8080"
    volumes:
      - model-data:/var/lib/aisme/models
    depends_on:
      db:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m
    restart: unless-stopped
    stop_grace_period: 2m

  db:
    image: pgvector/pgvector:0.8.2-pg18
    environment:
      POSTGRES_DB: aisme
      POSTGRES_USER: aisme
      POSTGRES_PASSWORD: aisme
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisme -d aisme"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.15
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:0.32.15
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama pull llama3.2
        ollama pull nomic-embed-text:v1.5
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  model-data:
  ollama-data:
